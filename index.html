<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Beyond the Wall</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root { --ink:#f3ecd8; --dim:#b9ae92; --gold:#ffd76a; --sea:#0b2a3a; --panel:rgba(8,20,28,.86); --line:rgba(255,235,180,.25); --hot:#ff8a3d; --good:#8df0b0; --warn:#ff5a6a; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:#06141c; color:var(--ink); overflow:hidden; font:15px/1.45 system-ui, 'Segoe UI', sans-serif; user-select:none; }
canvas { position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
.layer { position:fixed; inset:0; display:none; }
.layer.on { display:flex; }
.center { align-items:center; justify-content:center; flex-direction:column; text-align:center; }
#menu { background:radial-gradient(ellipse at center, rgba(6,20,28,.25), rgba(6,20,28,.8)); }
h1 { margin:0 0 .15em; font:900 clamp(34px,6vw,76px)/1 Georgia, serif; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); text-shadow:0 4px 30px #000; }
.sub { color:var(--dim); margin:0 0 2em; letter-spacing:.2em; text-transform:uppercase; font-size:13px; }
button { font:600 16px system-ui; color:var(--ink); background:rgba(255,235,180,.08); border:1px solid var(--line); border-radius:8px; padding:.65em 1.4em; cursor:pointer; min-width:220px; margin:.3em; }
button:hover:not(:disabled) { background:rgba(255,215,106,.22); border-color:var(--gold); }
button:disabled { opacity:.4; cursor:default; }
button.small { min-width:0; padding:.3em .8em; font-size:13px; margin:0 .15em; }
.box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.4em 1.8em; max-width:min(620px,92vw); text-align:left; backdrop-filter:blur(8px); }
.box h2 { margin:.1em 0 .5em; color:var(--gold); font-family:Georgia, serif; }
.opt { display:grid; grid-template-columns:150px 1fr 50px; gap:10px; align-items:center; margin:.5em 0; }
.opt input { width:100%; }
.card { max-width:640px; font:italic 26px/1.5 Georgia, serif; padding:0 1em; color:#fff; -webkit-text-stroke:5px #000; paint-order:stroke fill; text-shadow:0 2px 10px #000, 0 0 3px #000; transition:opacity .6s; }
.hint { color:var(--dim); font-size:13px; margin-top:1.6em; letter-spacing:.1em; }
#intro { background:radial-gradient(ellipse at center, rgba(4,12,18,.78), rgba(2,8,12,.94)); }
#intro .hint { color:#fff; -webkit-text-stroke:3px #000; paint-order:stroke fill; }
#hud { pointer-events:none; }
#hud > * { position:absolute; text-shadow:0 1px 3px #000; }
#stats { left:18px; bottom:18px; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:210px; }
#stats .row { display:flex; justify-content:space-between; gap:14px; }
.bar { height:7px; background:#ffffff22; border-radius:4px; overflow:hidden; margin:2px 0 6px; } .bar i { display:block; height:100%; background:var(--good); }
#stats b { color:var(--gold); font-weight:600; }
#slash { left:50%; top:50%; width:46vmin; height:46vmin; margin:-23vmin 0 0 -23vmin; border-radius:50%; border-top:5px solid rgba(255,255,255,.9); opacity:0; pointer-events:none; }
#slash.go { animation:slash .18s ease-out; }
@keyframes slash { 0% { opacity:.95; transform:rotate(-75deg) scale(.7); } 100% { opacity:0; transform:rotate(35deg) scale(1.05); } }
#weapon { left:46%; bottom:-6vh; z-index:6; width:66vh; height:64vh; transform-origin:50% 100%; display:none; pointer-events:none; filter:drop-shadow(0 .4vh .4vh #0009); animation:wIdle 3.4s steps(6) infinite; }
#weapon[data-walk] { animation:wWalk .56s steps(6) infinite; }
@keyframes wWalk { 0%,100% { transform:translate(0,0) rotate(4deg); } 25% { transform:translate(.9vw,1.4vh) rotate(4deg); } 50% { transform:translate(0,0) rotate(4deg); } 75% { transform:translate(-.9vw,1.4vh) rotate(4deg); } }
#weapon img { width:100%; height:100%; image-rendering:pixelated; display:block; }
#weapon .mf { position:absolute; left:37%; top:41%; width:6vh; height:6vh; background:#ffd76a; opacity:0; }
/* bare hand: one fist low on the right; it jabs toward the crosshair */
#weapon[data-bare] { left:auto; right:7vw; width:54vh; height:54vh; bottom:-9vh; }
#weapon[data-bare].a-fists { animation:jab .24s steps(5); }
@keyframes jab { 0% { transform:translate(0,0) } 45% { transform:translate(-17vw,-12vh) scale(.82) } 100% { transform:translate(0,0) } }
#weapon.a-sword { animation:aSword .32s steps(7); } #weapon.a-dagger { animation:aDagger .22s steps(5); } #weapon.a-spear { animation:aSpear .4s steps(8); } #weapon.a-axe { animation:aAxe .55s steps(9); } #weapon.a-bearded { animation:aAxe .4s steps(7); } #weapon.a-daneaxe { animation:aAxe .75s steps(11); } #weapon.a-pistol { animation:aPistol .35s steps(6); } #weapon.a-pistol .mf { animation:mf .14s steps(2); }
@keyframes wIdle { 0%,100% { transform:translate(0,0) rotate(4deg); } 50% { transform:translate(-.4vw,-.8vh) rotate(6deg); } }
@keyframes aSword { 0% { transform:rotate(4deg); } 18% { transform:translate(5vw,-3vh) rotate(30deg); } 45% { transform:translate(-16vw,-8vh) rotate(-62deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aDagger { 0% { transform:rotate(4deg); } 18% { transform:translate(3vw,4vh); } 45% { transform:translate(-6vw,-18vh) rotate(-6deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aSpear { 0% { transform:rotate(4deg); } 20% { transform:translate(5vw,6vh); } 48% { transform:translate(-8vw,-24vh) rotate(-3deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aAxe { 0% { transform:rotate(4deg); } 25% { transform:translate(4vw,-7vh) rotate(38deg); } 55% { transform:translate(-12vw,6vh) rotate(34deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aPistol { 0% { transform:rotate(4deg); } 18% { transform:translate(0,3vh) rotate(-16deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes mf { 0% { opacity:1; transform:rotate(45deg) scale(1.2); } 100% { opacity:0; transform:rotate(45deg) scale(.6); } }
#hurt { left:0; top:0; right:0; bottom:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 22vmin 7vmin rgba(220,30,30,.75); } #hurt.go { animation:hurt .4s ease-out; } @keyframes hurt { 0% { opacity:1; } 100% { opacity:0; } }
#speedo { left:50%; bottom:18px; transform:translateX(-50%); text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 18px 6px; min-width:96px; display:none; color:var(--dim); }
#speedo b { color:var(--gold); font:600 30px/1.1 system-ui; font-variant-numeric:tabular-nums; }
#speedo .bar { margin:2px 0 0; }
#compass { top:10px; left:50%; transform:translateX(-50%); width:360px; height:56px; }
#compass .win { position:relative; width:360px; height:30px; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-sizing:content-box; }
#compass .strip { position:absolute; left:0; top:0; height:30px; }
#compass i { position:absolute; bottom:0; transform:translateX(-50%); min-width:1px; height:5px; border-left:1px solid var(--dim); font:600 12px/1 system-ui; font-style:normal; color:var(--dim); }
#compass i.main, #compass i.mid { border:0; height:auto; bottom:8px; }
#compass i.main { font-size:16px; color:var(--ink); bottom:7px; } #compass i.north { color:#ff7a5c; }
#compass .clk { position:absolute; left:370px; top:6px; font:600 13px/1 system-ui; color:var(--ink); white-space:nowrap; text-shadow:0 1px 2px #000; }
#compass .mark { position:absolute; left:50%; top:0; margin-left:-5px; border:5px solid transparent; border-top-color:var(--gold); }
#compass .ship { position:absolute; top:24px; transform:translateX(-50%); text-align:center; display:none; white-space:nowrap; }
#compass .ship svg { display:block; margin:0 auto; } #compass .ship small { display:block; font-size:11px; color:var(--gold); }
#obj { top:76px; left:50%; transform:translateX(-50%); text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 16px; max-width:min(560px,90vw); }
#obj small { color:var(--dim); display:block; }
#windArrow { display:inline-block; font-style:normal; line-height:0; transition:transform .1s; }
#windArrow .dart { width:20px; height:24px; }
#arrow { display:inline-block; width:20px; height:24px; vertical-align:middle; transition:transform .1s; }
.trim { position:relative; height:8px; margin:3px 0 1px; background:rgba(255,235,180,.16); border-radius:4px; }
.trim i { position:absolute; top:-2px; width:5px; height:12px; margin-left:-2.5px; border-radius:2px; }
.trim .cur { background:#fff; box-shadow:0 0 0 1px #000; }
.trim .best { background:#ffd76a; opacity:.9; }
.trimk { font-size:10px; opacity:.6; margin-bottom:3px; }
#tips { display:none; left:50%; bottom:18px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; max-width:min(620px,92vw); text-align:center; }
#tips div { color:var(--ink); margin:2px 0 8px; }
kbd { background:rgba(255,235,180,.14); border:1px solid var(--line); border-radius:4px; padding:0 5px; font:600 12px system-ui; }
#log { right:18px; bottom:18px; text-align:right; max-width:min(420px,50vw); color:var(--ink); }
#log div { opacity:.9; } #log div:last-child { opacity:1; font-weight:600; color:var(--gold); }
#prompt { left:50%; top:50%; z-index:99; transform:translate(-50%,-50%); white-space:nowrap; font-size:17px; padding:6px 16px; background:var(--panel); border:1px solid var(--gold); border-radius:8px; color:var(--gold); font-weight:600; display:none; }
#wind { right:18px; top:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; text-align:center; font-size:12px; color:var(--dim); }
#wind i { display:block; font-style:normal; font-size:24px; color:var(--ink); transition:transform .2s; }
#cross { left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:#fff; opacity:.6; display:none; }
#keys { left:18px; top:16px; font-size:12px; color:var(--dim); line-height:1.6; }
#panel { background:rgba(0,0,0,.45); }
#mapc { position:static; image-rendering:auto; } /* the page-wide canvas rule is for the game view only */
#panel .box { min-width:min(520px,92vw); }
#panel table { width:100%; border-collapse:collapse; margin:.4em 0; }
#panel td, #panel th { padding:4px 6px; text-align:left; border-bottom:1px solid #ffffff14; }
#panel td.n, #panel th.n { text-align:right; }
.gold { color:var(--gold); } .good { color:#8fd18a; } .bad { color:var(--warn); }
.npc { color:var(--dim); font-size:13px; margin-bottom:.6em; letter-spacing:.08em; text-transform:uppercase; }
#err { background:#06141c; padding:2em; z-index:9; font-size:18px; color:var(--dim); }
#loading { background:#06141c; z-index:8; color:var(--dim); letter-spacing:.2em; text-transform:uppercase; font-size:13px; }
#fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .8s; z-index:7; }
@media (max-width:700px) { #keys { display:none; } }
</style>
</head>

<canvas id=c></canvas>
<div id=hud class=layer>
  <div id=keys></div>
  <div id=obj></div>
  <div id=speedo></div>
  <div id=slash></div>
  <div id=weapon></div>
  <div id=hurt></div>
  <div id=wind><i id=windArrow>➤</i><span id=windTxt></span></div>
  <div id=stats></div>
  <div id=log></div>
  <div id=tips></div>
  <div id=prompt></div>
  <div id=cross></div>
</div>
<div id=fade></div>
<div id=menu class="layer center"></div>
<div id=intro class="layer center"></div>
<div id=panel class="layer center"></div>
<div id=pause class="layer center" style="background:rgba(0,0,0,.55)"></div>
<div id=end class="layer center" style="background:rgba(4,12,18,.92)"></div>
<div id=loading class="layer center on">Charting the seas…</div>

rs."],opts:[{t:"Take the reward",gold:e.pay,rep:10,say:"The family will not forget this."}]}})},map:{title:"Half a Map",need:"ab",pay:260,ask:e=>`${e.giver} has half a treasure map. ${e.crew} hold the other half.`,steps:e=>({start:{kind:"fight",at:"b",n:4,goal:`Take the other half from ${e.crew} at ${e.b}.`,say:`The two halves fit. The mark is on ${e.a}, and ${e.crew} saw you read it.`,to:"race"},race:{kind:"fight",at:"a",n:3,goal:`Beat ${e.crew} to the mark on ${e.a}.`,say:"The beach is yours. Now dig.",to:"dig"},dig:{kind:"find",at:"a",goal:`Dig up the cache on ${e.a}.`,say:"A sea chest, heavy and dry inside.",gold:e.pay,rep:4}})},debt:{title:"The Debt",need:"b",pay:160,ask:e=>`${e.giver} owes money to ${e.other}, who is not a patient lender.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Settle with ${e.other} at ${e.b}.`,lines:[`${e.giver} sent you? Eighty gold and the paper burns. Or you can try your luck.`],opts:[{t:"Pay the 80 gold",cost:80,to:"back"},{t:"Draw your weapon",to:"fight"},{t:"Offer to collect for him",gold:90,rep:-12,say:"You take his coin and his side. The town will remember."}]},fight:{kind:"fight",at:"b",n:3,goal:"Beat the lender's men.",say:"The ledger goes in the harbour.",to:"back"},back:{kind:"talk",at:"home",who:e.giver,goal:`Tell ${e.giver} it is done.`,lines:["Done? Truly? Take this. It is everything I had put by to pay him."],opts:[{t:"Accept it",gold:e.pay,rep:8,say:"A debt ends."},{t:"Refuse the money",rep:16,world:2,say:"Word of your kindness travels."}]}})},cargo:{title:"A Cargo That Isn't",need:"b",pay:150,ask:e=>`${e.giver} needs sealed crates taken to ${e.b} before the buyer sails.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,secs:e.secs,late:{say:"The buyer has sailed. The crates are worth nothing to anyone else.",to:"late"},goal:`Deliver the crates to ${e.other} at ${e.b}.`,lines:["In time. Good.","A lid came loose on the way, did it not? Muskets. Double pay to forget them."],opts:[{t:"Take the double pay",gold:e.pay*2,rep:-10,say:"The crates vanish into the night."},{t:"Call the guards",to:"raid"}]},raid:{kind:"fight",at:"b",n:3,goal:`Stop the smugglers at ${e.b}.`,say:"The guards take the muskets and count out a reward.",gold:e.pay,rep:10,world:3},late:{kind:"talk",at:"home",who:e.giver,goal:`Tell ${e.giver} you were too late.`,lines:["Late. They will not deal with me again. Here, for your trouble."],opts:[{t:"Take it",gold:Math.round(e.pay/4),rep:-2}]}})},ghost:{title:"A Ghost on the Lanes",need:"ab",ship:!0,pay:280,ask:e=>`Sailors vanish, says ${e.giver}. The last wreck washed up on ${e.a}.`,steps:e=>({start:{kind:"find",at:"a",goal:`Search the wreck on ${e.a}.`,say:"A sodden log. The last entry: a pale ship takes crews off this very point.",to:"hunt"},hunt:{kind:"board",at:"a",ship:"ghost",name:"Pale Widow",goal:`Board the Pale Widow off ${e.a}.`,say:`In the captain's cabin: a locket, and a note twelve years old. "For my daughter in ${e.b}."`,lost:"The pale ship slips under, and whatever she carried with her.",to:"locket"},locket:{kind:"talk",at:"b",who:e.other,goal:`Take the locket to ${e.other} at ${e.b}.`,lines:["My father? He sailed before I could walk. Where did you get this?"],opts:[{t:"Tell the whole truth",gold:e.pay,rep:8,world:3,say:"She listens to the end, and pays you what she can."},{t:"Say he died bravely",gold:e.pay,rep:6,say:"She holds the locket a long while."},{t:"Say nothing and sell it",gold:Math.round(e.pay*1.4),rep:-8,say:"A jeweller does not ask where it came from."}]}})},swordswoman:{title:"A Blade Owed",need:"a",pay:200,join:"swordswoman",ask:e=>`${e.third} was beaten and shamed by a duellist who now hides on ${e.a}. She will walk with you.`,steps:e=>({start:{kind:"fight",at:"a",n:3,boss:!0,goal:`Find the duellist on ${e.a}.`,say:"The duellist yields. She stands over him a long while, then sheathes her sword.",to:"after"},after:{kind:"talk",at:"a",who:e.third,goal:"Speak with her.",lines:["A year I wanted that. I thought it would feel bigger.","I have no plans after today."],opts:[{t:"Join my crew",hire:"swordswoman",gold:e.pay,say:"She nods once."},{t:"Part as friends",gold:e.pay,rep:4,say:"She pays you from the duellist's purse and walks off."}]}})},cartographer:{title:"The Last Chart",need:"a",pay:240,join:"cartographer",chart:!0,ask:e=>`${e.third} wants to finish one last chart on ${e.a}, and needs an escort. A copy of the chart is yours if you see it through.`,steps:e=>({start:{kind:"find",at:"a",goal:`Take the cartographer to the old marker on ${e.a}.`,say:'"There it is!" The marker is real. So, it seems, are the people who followed you.',to:"amb"},amb:{kind:"fight",at:"a",n:3,goal:"Protect the cartographer.",say:"Quiet again. The chart is finished.",to:"after"},after:{kind:"talk",at:"a",who:e.third,goal:"Speak with the cartographer.",lines:["Under the marker, as I promised. Your share, and thank you."],opts:[{t:"Sail with me as navigator",hire:"cartographer",gold:e.pay,say:'"At my age? ...Yes."'},{t:"Farewell",gold:e.pay,rep:4,say:"The chart will outlive you both."}]}})},singer:{title:"A Song Taken",need:"b",pay:150,join:"singer",ask:e=>`${e.third} had a harp taken for a debt, and it hangs in ${e.b}. The singer will walk with you.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Get the harp from ${e.other} at ${e.b}.`,lines:["The harp? Fifty gold and it sings for you. Or you can try taking it."],opts:[{t:"Pay the 50 gold",cost:50,to:"after"},{t:"Draw your weapon",to:"fight"}]},fight:{kind:"fight",at:"b",n:2,goal:"Take the harp.",say:"The harp is yours, one string short.",rep:-6,to:"after"},after:{kind:"talk",at:"b",who:e.third,goal:"Give the singer the harp.",lines:["Oh, there you are, old girl. I owe you a song and a share of my winnings."],opts:[{t:"Sing for my crew",hire:"singer",gold:e.pay,say:'"Is there rum? Then yes."'},{t:"Farewell",gold:e.pay,rep:4,say:"You hear the tune for an hour afterwards."}]}})},deserter:{title:"New Papers",need:"ab",pay:190,join:"deserter",ask:e=>`${e.third} ran from the navy and hides in a cellar here. ${e.other}, a forger in ${e.b}, can make new papers. The deserter will walk with you.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Get new papers from ${e.other} at ${e.b}.`,lines:["Papers for a runaway? Seventy gold, and the ink is still wet when you leave."],opts:[{t:"Pay the 70 gold",cost:70,to:"search"},{t:"Draw your weapon",to:"forger"}]},forger:{kind:"fight",at:"b",n:2,goal:`Take the papers from ${e.other}'s men.`,say:"The forger signs at knife point. The hand is shaky, but it will pass.",rep:-6,to:"search"},search:{kind:"fight",at:"a",n:3,goal:`A navy shore party is combing ${e.a} for the deserter. Drive them off.`,say:"The marines run for their boat. With new papers, nobody will look twice.",world:-1,to:"after"},after:{kind:"talk",at:"a",who:e.third,goal:"Speak with the deserter.",lines:["A new name, at last. I know every patrol lane in these waters. That is worth something to a captain with a record."],opts:[{t:"Sail with me as navigator",hire:"deserter",gold:e.pay,say:'"The navy will have to look twice as hard for you now."'},{t:"Part here",gold:e.pay,rep:4,say:"They press a purse on you and are gone by the next tide."}]}})},shieldmaiden:{title:"The Broken Shield",need:"ab",pay:170,join:"shieldmaiden",hero:"maid",ask:e=>`${e.maid}, a shieldmaiden, lost her place in the shield wall when raiders burned her jarl's hall. ${e.other} in ${e.b} holds her shield against her brother's debt. She will walk with you.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Win back the shield from ${e.other} in ${e.b}.`,lines:["Her shield pays a dead man's debt. Eighty gold, or meet me in the holmgang ring."],opts:[{t:"Pay the 80 gold",cost:80,to:"raiders"},{t:"Step into the ring",to:"holmgang"}]},holmgang:{kind:"fight",at:"b",n:1,boss:!0,goal:`Beat ${e.other} in the holmgang.`,say:"Your foe yields in the ring. By the old law the shield is hers, and nobody calls it theft.",rep:3,to:"raiders"},raiders:{kind:"fight",at:"a",n:3,goal:`The raiders who burned the hall camp on ${e.a}. Break them.`,say:"The last raider runs into the sea. The hall is avenged.",world:2,to:"after"},after:{kind:"talk",at:"a",who:e.maid,goal:"Speak with the shieldmaiden.",lines:["A shield on my arm and a debt paid in blood. I owe you a place in my wall, ashore or on a deck."],opts:[{t:"Sail with me",hire:"shieldmaiden",gold:e.pay,say:'"Stand behind me when the axes fly."'},{t:"Part here",gold:e.pay,rep:4,say:"She raises the shield to you and walks off to find a new hall."}]}})},runereader:{title:"The Stone That Lies",need:"a",pay:180,join:"runereader",hero:"maid",ask:e=>`${e.maid}, a rune-reader, says someone has cut false runes over the old stone on ${e.a}, and the dead there will not rest for it. She will walk with you.`,steps:e=>({start:{kind:"find",at:"a",goal:`Take the rune-reader to the cut stone on ${e.a}.`,say:`"Barrow-robbers' work. They carved a lie so the dead would sleep while they dug." Spades ring on stone nearby.`,to:"robbers"},robbers:{kind:"fight",at:"a",n:3,goal:`Drive the barrow-robbers off ${e.a}.`,say:"The robbers drop their spades and run. She scrapes the false runes away, and the stone tells the truth again.",world:2,to:"after"},after:{kind:"talk",at:"a",who:e.maid,goal:"Speak with the rune-reader.",lines:["Every stone in the north has a second tongue under the first. I can hear it. You cannot. Yet."],opts:[{t:"Sail with me and read the stones",hire:"runereader",gold:e.pay,say:'"Every stone, mind. Even the dull ones."'},{t:"Part here",gold:e.pay,rep:4,say:"She walks off toward the next stone, talking to it already."}]}})},urchin:{title:"Quick Hands",need:"b",pay:130,join:"urchin",ask:e=>`${e.third}, a street kid with quick hands, steals for ${e.other}, a fence in ${e.b} who keeps a gang of children working the markets. The kid wants out, and will walk with you.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Buy the kid free of ${e.other}, the fence in ${e.b}.`,lines:["That one owes me a month of purses. Sixty gold and the debt is gone. Or my lads can teach you both a lesson."],opts:[{t:"Pay the 60 gold",cost:60,to:"after"},{t:"Draw your weapon",to:"fence"}]},fence:{kind:"fight",at:"b",n:3,goal:`Break ${e.other}'s gang in ${e.b}.`,say:"The fence's lads scatter, and the children he kept slip off into the lanes. Nobody here is sorry.",rep:3,to:"after"},after:{kind:"talk",at:"b",who:e.third,goal:"Speak with the kid.",lines:["I lifted his strongbox while you were talking. Half is yours, fair is fair. ...I could be useful on a ship. I can climb anything."],opts:[{t:"Sign on as ship's boy",hire:"urchin",gold:e.pay,say:'"Nobody will touch your purse while I am about. Nobody but me. Joking!"'},{t:"Find them an honest master",gold:e.pay,rep:6,say:"A sailmaker takes the kid on. You hear later they are the fastest hand on the quay."}]}})},noble:{title:"The Runaway Heir",need:"b",pay:200,join:"noble",ask:e=>`${e.third}, the heir of a noble house, ran from a marriage arranged for them. The house steward, ${e.other}, waits in ${e.b} with hired swords. The heir will walk with you.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,goal:`Face ${e.other}, the house steward in ${e.b}.`,lines:["The heir comes home, or I go home without my post. Ninety gold and I tell the house the trail went cold. Otherwise my men will take them."],opts:[{t:"Pay the 90 gold",cost:90,to:"after"},{t:"Draw your weapon",to:"swords"}]},swords:{kind:"fight",at:"b",n:3,goal:`Drive off the steward's hired swords in ${e.b}.`,say:"The hired swords decide the pay was not enough. The steward leaves on the next boat.",rep:-2,to:"after"},after:{kind:"talk",at:"b",who:e.third,goal:"Speak with the heir.",lines:["That is the end of it. Here: what is left of my allowance. I can shoot, you know. Father paid for that much."],opts:[{t:"Sail with me",hire:"noble",gold:e.pay,say:'"If a magistrate ever troubles you, let me do the talking. They all knew my father."'},{t:"Go home on your own terms",gold:e.pay,rep:6,say:"The heir sails home to tell the house no in person. A letter of thanks follows you from port to port."}]}})},race:{title:"The Race",need:"b",ship:!0,stake:Fs,pay:2*Fs+90,ask:e=>`Captain ${e.rival} of ${e.crew} bets ${Fs} gold a side that ${e.rship} reaches ${e.b} before you. The harbour judge there keeps the purse.`,steps:e=>({start:{kind:"talk",at:"b",who:e.other,secs:e.rsecs,late:{say:`${e.rship} is already tied up at ${e.b}, and ${e.crew} jeer from the quay. They keep your stake.`},goal:`Race ${e.rship} to ${e.b} and find the harbour judge, ${e.other}.`,lines:[`Before ${e.rship}? So you are! ${e.crew} will be sour for a month.`],opts:[{t:"Take the purse",gold:e.pay,rep:4,world:1,say:"The quay cheers. Word of the race goes round."},{t:"Stand the losers a round",gold:e.pay-30,rep:10,world:2,say:`${e.crew} drink to you, grudgingly. Even rivals tell this one kindly.`}]}})},wedding:{title:"The Missing Groom",need:"a",pay:150,ask:e=>`The groom rowed off toward ${e.a} at dawn. ${e.giver} wants him found.`,steps:e=>({start:{kind:"talk",at:"a",who:e.third,goal:`Find the groom on ${e.a}.`,lines:["I am not running from her. I am running from her mother. ...Must I go back?"],opts:[{t:"Walk him back",to:"back"},{t:"Let him go",to:"gone"}]},back:{kind:"talk",at:"home",who:e.giver,lead:!0,goal:`Bring the groom to ${e.giver}.`,lines:["There he is! Wash him, somebody. The feast is going cold."],opts:[{t:"Take the reward",gold:e.pay,rep:10}]},gone:{kind:"talk",at:"home",who:e.giver,goal:`Tell ${e.giver} there will be no groom.`,lines:["Gone? Well. Better today than in a year."],opts:[{t:"Say you are sorry",gold:Math.round(e.pay/5),rep:2},{t:"Say he drowned",gold:Math.round(e.pay/2),rep:-6,say:"The whole town mourns a man who is fishing quite happily."}]}})},trial:{title:"The Trial",need:"",pay:90,ask:e=>`${e.other} stands accused of theft. The magistrate and the family both want a word with you.`,steps:e=>({start:{kind:"talk",at:"home",who:e.other,goal:`H
