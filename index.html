<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Beyond the Wall</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root { --ink:#f3ecd8; --dim:#b9ae92; --gold:#ffd76a; --sea:#0b2a3a; --panel:rgba(8,20,28,.86); --line:rgba(255,235,180,.25); --hot:#ff8a3d; --good:#8df0b0; --warn:#ff5a6a; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:#06141c; color:var(--ink); overflow:hidden; font:15px/1.45 system-ui, 'Segoe UI', sans-serif; user-select:none; }
canvas { position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
.layer { position:fixed; inset:0; display:none; }
.layer.on { display:flex; }
.center { align-items:center; justify-content:center; flex-direction:column; text-align:center; }
#menu { background:radial-gradient(ellipse at center, rgba(6,20,28,.25), rgba(6,20,28,.8)); }
h1 { margin:0 0 .15em; font:900 clamp(34px,6vw,76px)/1 Georgia, serif; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); text-shadow:0 4px 30px #000; }
.sub { color:var(--dim); margin:0 0 2em; letter-spacing:.2em; text-transform:uppercase; font-size:13px; }
button { font:600 16px system-ui; color:var(--ink); background:rgba(255,235,180,.08); border:1px solid var(--line); border-radius:8px; padding:.65em 1.4em; cursor:pointer; min-width:220px; margin:.3em; }
button:hover:not(:disabled) { background:rgba(255,215,106,.22); border-color:var(--gold); }
button:disabled { opacity:.4; cursor:default; }
button.small { min-width:0; padding:.3em .8em; font-size:13px; margin:0 .15em; }
.box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.4em 1.8em; max-width:min(620px,92vw); text-align:left; backdrop-filter:blur(8px); }
.box h2 { margin:.1em 0 .5em; color:var(--gold); font-family:Georgia, serif; }
.opt { display:grid; grid-template-columns:150px 1fr 50px; gap:10px; align-items:center; margin:.5em 0; }
.opt input { width:100%; }
.card { max-width:640px; font:italic 26px/1.5 Georgia, serif; padding:0 1em; color:#fff; -webkit-text-stroke:5px #000; paint-order:stroke fill; text-shadow:0 2px 10px #000, 0 0 3px #000; transition:opacity .6s; }
.hint { color:var(--dim); font-size:13px; margin-top:1.6em; letter-spacing:.1em; }
#intro { background:radial-gradient(ellipse at center, rgba(4,12,18,.78), rgba(2,8,12,.94)); }
#intro .hint { color:#fff; -webkit-text-stroke:3px #000; paint-order:stroke fill; }
#hud { pointer-events:none; }
#hud > * { position:absolute; text-shadow:0 1px 3px #000; }
#stats { left:18px; bottom:18px; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:210px; }
#stats .row { display:flex; justify-content:space-between; gap:14px; }
.bar { height:7px; background:#ffffff22; border-radius:4px; overflow:hidden; margin:2px 0 6px; } .bar i { display:block; height:100%; background:var(--good); }
#stats b { color:var(--gold); font-weight:600; }
#slash { left:50%; top:50%; width:46vmin; height:46vmin; margin:-23vmin 0 0 -23vmin; border-radius:50%; border-top:5px solid rgba(255,255,255,.9); opacity:0; pointer-events:none; }
#slash.go { animation:slash .18s ease-out; }
@keyframes slash { 0% { opacity:.95; transform:rotate(-75deg) scale(.7); } 100% { opacity:0; transform:rotate(35deg) scale(1.05); } }
#weapon { left:46%; bottom:-6vh; z-index:6; width:66vh; height:64vh; transform-origin:50% 100%; display:none; pointer-events:none; filter:drop-shadow(0 .4vh .4vh #0009); animation:wIdle 3.4s steps(6) infinite; }
#weapon[data-walk] { animation:wWalk .56s steps(6) infinite; }
@keyframes wWalk { 0%,100% { transform:translate(0,0) rotate(4deg); } 25% { transform:translate(.9vw,1.4vh) rotate(4deg); } 50% { transform:translate(0,0) rotate(4deg); } 75% { transform:translate(-.9vw,1.4vh) rotate(4deg); } }
#weapon img { width:100%; height:100%; image-rendering:pixelated; display:block; }
#weapon .mf { position:absolute; left:37%; top:41%; width:6vh; height:6vh; background:#ffd76a; opacity:0; }
/* bare hand: one fist low on the right; it jabs toward the crosshair */
#weapon[data-bare] { left:auto; right:7vw; width:54vh; height:54vh; bottom:-9vh; }
#weapon[data-bare].a-fists { animation:jab .24s steps(5); }
@keyframes jab { 0% { transform:translate(0,0) } 45% { transform:translate(-17vw,-12vh) scale(.82) } 100% { transform:translate(0,0) } }
#weapon.a-sword { animation:aSword .32s steps(7); } #weapon.a-dagger { animation:aDagger .22s steps(5); } #weapon.a-spear { animation:aSpear .4s steps(8); } #weapon.a-axe { animation:aAxe .55s steps(9); } #weapon.a-bearded { animation:aAxe .4s steps(7); } #weapon.a-daneaxe { animation:aAxe .75s steps(11); } #weapon.a-pistol { animation:aPistol .35s steps(6); } #weapon.a-pistol .mf { animation:mf .14s steps(2); }
@keyframes wIdle { 0%,100% { transform:translate(0,0) rotate(4deg); } 50% { transform:translate(-.4vw,-.8vh) rotate(6deg); } }
@keyframes aSword { 0% { transform:rotate(4deg); } 18% { transform:translate(5vw,-3vh) rotate(30deg); } 45% { transform:translate(-16vw,-8vh) rotate(-62deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aDagger { 0% { transform:rotate(4deg); } 18% { transform:translate(3vw,4vh); } 45% { transform:translate(-6vw,-18vh) rotate(-6deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aSpear { 0% { transform:rotate(4deg); } 20% { transform:translate(5vw,6vh); } 48% { transform:translate(-8vw,-24vh) rotate(-3deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aAxe { 0% { transform:rotate(4deg); } 25% { transform:translate(4vw,-7vh) rotate(38deg); } 55% { transform:translate(-12vw,6vh) rotate(34deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes aPistol { 0% { transform:rotate(4deg); } 18% { transform:translate(0,3vh) rotate(-16deg); } 100% { transform:translate(0,0) rotate(4deg); } }
@keyframes mf { 0% { opacity:1; transform:rotate(45deg) scale(1.2); } 100% { opacity:0; transform:rotate(45deg) scale(.6); } }
#hurt { left:0; top:0; right:0; bottom:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 22vmin 7vmin rgba(220,30,30,.75); } #hurt.go { animation:hurt .4s ease-out; } @keyframes hurt { 0% { opacity:1; } 100% { opacity:0; } }
#speedo { left:50%; bottom:18px; transform:translateX(-50%); text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 18px 6px; min-width:96px; display:none; color:var(--dim); }
#speedo b { color:var(--gold); font:600 30px/1.1 system-ui; font-variant-numeric:tabular-nums; }
#speedo .bar { margin:2px 0 0; }
#compass { top:10px; left:50%; transform:translateX(-50%); width:360px; height:56px; }
#compass .win { position:relative; width:360px; height:30px; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-sizing:content-box; }
#compass .strip { position:absolute; left:0; top:0; height:30px; }
#compass i { position:absolute; bottom:0; transform:translateX(-50%); min-width:1px; height:5px; border-left:1px solid var(--dim); font:600 12px/1 system-ui; font-style:normal; color:var(--dim); }
#compass i.main, #compass i.mid { border:0; height:auto; bottom:8px; }
#compass i.main { font-size:16px; color:var(--ink); bottom:7px; } #compass i.north { color:#ff7a5c; }
#compass .clk { position:absolute; left:370px; top:6px; font:600 13px/1 system-ui; color:var(--ink); white-space:nowrap; text-shadow:0 1px 2px #000; }
#compass .mark { position:absolute; left:50%; top:0; margin-left:-5px; border:5px solid transparent; border-top-color:var(--gold); }
#compass .ship { position:absolute; top:24px; transform:translateX(-50%); text-align:center; display:none; white-space:nowrap; }
#compass .ship svg { display:block; margin:0 auto; } #compass .ship small { display:block; font-size:11px; color:var(--gold); }
#obj { top:76px; left:50%; transform:translateX(-50%); text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 16px; max-width:min(560px,90vw); }
#obj small { color:var(--dim); display:block; }
#windArrow { display:inline-block; font-style:normal; line-height:0; transition:transform .1s; }
#windArrow .dart { width:20px; height:24px; }
#arrow { display:inline-block; width:20px; height:24px; vertical-align:middle; transition:transform .1s; }
.trim { position:relative; height:8px; margin:3px 0 1px; background:rgba(255,235,180,.16); border-radius:4px; }
.trim i { position:absolute; top:-2px; width:5px; height:12px; margin-left:-2.5px; border-radius:2px; }
.trim .cur { background:#fff; box-shadow:0 0 0 1px #000; }
.trim .best { background:#ffd76a; opacity:.9; }
.trimk { font-size:10px; opacity:.6; margin-bottom:3px; }
#tips { display:none; left:50%; bottom:18px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; max-width:min(620px,92vw); text-align:center; }
#tips div { color:var(--ink); margin:2px 0 8px; }
kbd { background:rgba(255,235,180,.14); border:1px solid var(--line); border-radius:4px; padding:0 5px; font:600 12px system-ui; }
#log { right:18px; bottom:18px; text-align:right; max-width:min(420px,50vw); color:var(--ink); }
#log div { opacity:.9; } #log div:last-child { opacity:1; font-weight:600; color:var(--gold); }
#prompt { left:50%; top:50%; z-index:99; transform:translate(-50%,-50%); white-space:nowrap; font-size:17px; padding:6px 16px; background:var(--panel); border:1px solid var(--gold); border-radius:8px; color:var(--gold); font-weight:600; display:none; }
#wind { right:18px; top:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; text-align:center; font-size:12px; color:var(--dim); }
#wind i { display:block; font-style:normal; font-size:24px; color:var(--ink); transition:transform .2s; }
#cross { left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:#fff; opacity:.6; display:none; }
#keys { left:18px; top:16px; font-size:12px; color:var(--dim); line-height:1.6; }
#panel { background:rgba(0,0,0,.45); }
#mapc { position:static; image-rendering:auto; } /* the page-wide canvas rule is for the game view only */
#panel .box { min-width:min(520px,92vw); }
#panel table { width:100%; border-collapse:collapse; margin:.4em 0; }
#panel td, #panel th { padding:4px 6px; text-align:left; border-bottom:1px solid #ffffff14; }
#panel td.n, #panel th.n { text-align:right; }
.gold { color:var(--gold); } .good { color:#8fd18a; } .bad { color:var(--warn); }
.npc { color:var(--dim); font-size:13px; margin-bottom:.6em; letter-spacing:.08em; text-transform:uppercase; }
#err { background:#06141c; padding:2em; z-index:9; font-size:18px; color:var(--dim); }
#loading { background:#06141c; z-index:8; color:var(--dim); letter-spacing:.2em; text-transform:uppercase; font-size:13px; }
#fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .8s; z-index:7; }
@media (max-width:700px) { #keys { display:none; } }
</style>
</head>

  <div id=keys></div>
  <div id=obj></div>
  <div id=speedo></div>
  <div id=slash></div>
  <div id=weapon></div>
  <div id=hurt></div>
  <div id=wind><i id=windArrow>➤</i><span id=windTxt></span></div>
  <div id=stats></div>
  <div id=log></div>
  <div id=tips></div>
  <div id=prompt></div>
  <div id=cross></div>
</div>
<div id=fade></div>
<div id=menu class="layer center"></div>
<div id=intro class="layer center"></div>
<div id=panel class="layer center"></div>

<div id=loading class="layer center on">Charting the seas…</div>
