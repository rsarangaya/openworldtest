<!doctype html>
<html lang=en>

<meta charset=utf-8>
<title>Beyond the Wall</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>

button.small { min-width:0; padding:.3em .8em; font-size:13px; margin:0 .15em; }

      ($2("pR") || $2("oB"))?.click();
      return;
    }
    if (e.repeat) {
      keys.add(e.code);
      return;
    }
    keys.add(e.code);
    if (phase === "panel" && e.code === "Escape") {
      ui.closePanel();
      phase = "play";
      return;
    }
    if (phase !== "play") return;
    if (e.code === "KeyF") onInteract();
    else if (e.code === "KeyR") toggleAuto(s);
    else if (e.code === "KeyO") toggleRow(s);
    else if (e.code === "Tab") {
      phase = "panel";
      unlock();
      ui.questLog(s, () => {
        phase = "play";
        lock();
      });
    }
  });
  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("mousedown", (e) => {
    if (e.button === 0 && phase === "play" && locked()) mouseDown = true;
  });
  addEventListener("mouseup", () => {
    mouseDown = false;
  });
  addEventListener("blur", () => keys.clear());
  addEventListener("mousemove", (e) => {
    if (phase !== "play" || !locked()) return;
    const k = 22e-4 * opts.sens;
    if (s.mode === "foot") {
      view.yaw += e.movementX * k;
      view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch - e.movementY * k));
    } else {
      orbit.yaw += e.movementX * k;
      orbit.pitch = Math.max(-0.9, Math.min(0.15, orbit.pitch - e.movementY * k));
      orbit.idle = 0;
    }
  });
  canvas.addEventListener("click", () => {
    audio.init();
    if (phase === "play") {
      goFullscreen();
      if (!locked()) lock();
    }
  });
  document.addEventListener("pointerlockchange", () => {
    ui.crosshair(locked() && s?.mode === "foot");
    if (locked()) return;
    if (expectUnlock) {
      expectUnlock = false;
      return;
    }
    if (phase === "play") pause();
  });
  addEventListener("resize", resize);
  function onInteract() {
    const r = interact(s);
    if (r.type === "npc") {
      phase = "panel";
      unlock();
      ui.dialog(s, r, { island: standingOn(s), audio, say: (m) => say(s, m), onChange: () => saveGame(s), onClose: () => {
        phase = "play";
        lock();
        saveGame(s);
      } });
    } else if (r.type === "news") {
      phase = "panel";
      unlock();
      ui.news(s, r.island, () => {
        phase = "play";
        lock();
        saveGame(s);
      });
    } else if (r.type === "ashore") {
      view.yaw = s.foot.yaw;
      view.pitch = 0;
      saveGame(s);
    } else if (r.type === "board") {
      orbit.yaw = 0;
      orbit.pitch = -0.22;
      orbit.idle = 0;
      saveGame(s);
    } else if (r.type === "dig") {
      audio.coin();
      saveGame(s);
    }
  }
  var getOptions = () => opts;
  var setOptions = (o) => {
    opts = o;
    saveOptions(o);
    audio.setVolume(o.volume);
    resize();
  };
  function showMenu() {
    phase = "menu";
    s = null;
    ui.hud(false);
    ui.crosshair(false);
    ui.loading(false);
    ui.menu({ hasSave: hasSave(), getOptions, setOptions, onNew: newGameFlow, onContinue: continueFlow });
  }
  function startPlay(game) {
    s = game;
    ui.fade(true);
    setTimeout(() => {
      const px = s.mode === "ship" ? s.ship.x : s.foot.x, pz = s.mode === "ship" ? s.ship.z : s.foot.z;
      updateSectors(px, pz, true);
      view.yaw = s.foot.yaw;
      view.pitch = 0;
      cam.blend = s.mode === "ship" ? 1 : 0;
      orbit.yaw = 0;
      orbit.pitch = -0.22;
      ui.hud(true);
      phase = "play";
      ui.fade(false);
      saveT = 0;
    }, 850);
  }
  async function newGameFlow() {
    goFullscreen();
    phase = "intro";
    await ui.intro([
      "Tuesday night. A documentary murmurs in a quiet apartment.",
      "\u201C\u2026the Wall. A cliff of ice ringing the whole world. Every map ends at it. No expedition has returned to say what lies beyond.\u201D",
      "The narrator calls it a legend. You cannot stop thinking about it.",
      "By morning your savings are spent and you are standing in Port Haven, the last harbour on the maps, with a one-way ticket and a lot of questions.",
      "Time to find out if the Wall is real."
    ]);
    startPlay(newGame(SEED));
  }
  function continueFlow() {
    goFullscreen();
    const g = loadGame();
    if (!g) return newGameFlow();
    startPlay(g);
  }
  function pause() {
    phase = "paused";
    unlock();
    ui.pause({ getOptions, setOptions, onResume: () => {
      phase = "play";
      lock();
    }, onSave: () => saveGame(s), onQuit: () => {
      saveGame(s);
      showMenu();
    } });
  }
  var soundScene = () => {
    if (s.mode !== "foot") return { foot: false, town: 0 };
    const i = standingOn(s), pz = i?.port && islandTown(i).plaza;
    if (!pz) return { foot: true, town: 0 };
    const w = { village: 0.5, town: 0.8, city: 1 }[i.tier] || 0.5;
    return { foot: true, town: w * Math.max(0, 1 - Math.max(0, Math.hypot(s.foot.x - pz.x, s.foot.z - pz.z) - 14) / 45) };
  };
  var prevMode = null;
  var last = performance.now();
  var acc = 0;
  var T = 0;
  var fpsN = 0;
  var fpsT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - last) / 1e3);
    last = now;
    T += dt;
    applyGuard();
    if (renderer.lost) {
      ui.error("The graphics device was lost: " + renderer.lost + ". Reload the page.");
      return;
    }
    if (s && phase === "play") {
      acc += dt;
      for (let n = 0; acc >= DT && n < 5; n++, acc -= DT) {
        const on2 = (k) => keys.has(k) ? 1 : 0;
        step(s, s.mode === "ship" ? { rudder: on2("KeyD") - on2("KeyA"), sail: on2("KeyW") - on2("KeyS"), trim: on2("KeyC") - on2("KeyZ"), fireL: keys.has("KeyQ"), fireR: keys.has("KeyE") } : { mx: on2("KeyD") - on2("KeyA"), mz: on2("KeyW") - on2("KeyS"), run: keys.has("ShiftLeft") || keys.has("ShiftRight"), jump: keys.has("Space"), yaw: view.yaw, attack: keys.has("KeyQ") || mouseDown }, DT);
      }
      for (const ev of s.events) {
        if (ev.type === "cannon") audio.boom(1 / (1 + Math.hypot(ev.x - (s.ship?.x || 0), ev.z - (s.ship?.z || 0)) / 60));
        else if (ev.type === "slash") {
          audio.slash(ev.hit);
          ui.slash();
        } else if (ev.type === "kill") audio.boom(0.25);
        else if (ev.type === "hit") audio.hit();
        else if (ev.type === "coin" || ev.type === "sunk") audio.coin();
        else if (ev.type === "quest") {
          audio.quest();
          saveGame(s);
        }
      }
      s.events.length = 0;
      saveT += dt;
      if (saveT > 30) {
        saveT = 0;
        saveGame(s);
      }
      if (s.ending) {
        phase = "ending";
        unlock();
        saveGame(s);
        ui.ending({ onReturn: () => {
          const g = gatePos(SEED);
          s.ending = false;
          s.ship.x = g.x * (1 - 140 / WALL_R);
          s.ship.z = g.z * (1 - 140 / WALL_R);
          s.ship.speed = 0;
          s.mode = "ship";
          phase = "play";
          lock();
        }, onMenu: showMenu });
      } else if (s.over) {
        phase = "over";
        unlock();
        ui.gameOver({ hasSave: hasSave(), onLoad: continueFlow, onMenu: showMenu });
      }
    }
    updateCamera(dt, T);
    const fx = s ? s.mode === "ship" && s.ship ? s.ship.x : s.foot.x : cam.x, fz = s ? s.mode === "ship" && s.ship ? s.ship.z : s.foot.z : cam.z;
    updateSectors(fx, fz);
    render(T);
    if (s && (phase === "play" || phase === "panel")) {
      const pr = prompt(s) || (!locked() ? "Click to capture the mouse" : null);
      if (s.mode !== prevMode) {
        prevMode = s.mode;
        ui.tips(s.mode === "ship");
      }
      ui.updateHud(s, { prompt: pr, yaw: cam.yaw });
      audio.update(s.ship?.speed || 0, Math.max(0, Math.min(1, (Math.hypot(cam.x, cam.z) / WALL_R - 0.5) / 0.4)), soundScene());
    }
    fpsN++;
    fpsT += dt;
    if (fpsT > 1) {
      window.__fps = fpsN / fpsT;
      fpsN = 0;
      fpsT = 0;
    }
  }
  (async () => {
    try {
      renderer = await createRenderer(canvas);
      sprites = createSprites(renderer);
    } catch (e) {
      ui.error(e.message);
      return;
    }
    audio.setVolume(opts.volume);
    resize();
    window.__pk = { home: homeIsland, town: islandTown, get s() {
      return s;
    }, get phase() {
      return phase;
    }, cam, view, opts, sectors, newGame: () => startPlay(newGame(SEED)), updateSectors, interact: onInteract, T: () => T };
    updateSectors(homeIsland().x, homeIsland().z, true);
    showMenu();
    requestAnimationFrame(loop);
  })();
})();
}catch(e){document.getElementById('err').textContent='Failed to start: '+e.message;document.getElementById('err').className='layer center on'}
</script>
</body>
